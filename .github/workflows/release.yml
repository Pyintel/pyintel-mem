name: Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.2)"
        required: true
        default: "v0.1.2"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows ${{ matrix.arch }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            target: x86_64-pc-windows-msvc
            asset: pmem-windows-x86_64.exe
          - arch: arm64
            target: aarch64-pc-windows-msvc
            asset: pmem-windows-arm64.exe
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Sign Windows Binary with Pyintel Certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Pyintel Core Intelligence, O=Pyintel, C=US" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5)
          
          # Sign binary with Authenticode
          Set-AuthenticodeSignature -Certificate $cert -FilePath "target/${{ matrix.target }}/release/pmem.exe"
          Get-AuthenticodeSignature "target/${{ matrix.target }}/release/pmem.exe"
          
          # Copy to release asset
          Copy-Item "target/${{ matrix.target }}/release/pmem.exe" "${{ matrix.asset }}"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-${{ matrix.arch }}-artifact
          path: ${{ matrix.asset }}

  build-linux-x86_64:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Release Binary
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/pmem pmem-linux-x86_64
          chmod +x pmem-linux-x86_64

      - name: Upload Linux x86_64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64-artifact
          path: pmem-linux-x86_64

  build-linux-arm64:
    name: Build (Linux ARM64 / Raspberry Pi / Jetson)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install ARM64 Cross Linker
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build Release Binary
        env:
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
        run: |
          cargo build --release --target aarch64-unknown-linux-gnu
          cp target/aarch64-unknown-linux-gnu/release/pmem pmem-linux-arm64
          chmod +x pmem-linux-arm64

      - name: Upload Linux ARM64 Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-arm64-artifact
          path: pmem-linux-arm64

  build-macos:
    name: Build (macOS Apple Silicon ARM64 + Universal + Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Apple Silicon (ARM64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel Mac (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package & Create Universal Binary
        run: |
          cp target/aarch64-apple-darwin/release/pmem pmem-macos-aarch64
          cp target/x86_64-apple-darwin/release/pmem pmem-macos-x86_64
          lipo -create -output pmem-macos-universal pmem-macos-aarch64 pmem-macos-x86_64
          
          # Ad-hoc sign binaries for Gatekeeper
          codesign -s - --force pmem-macos-aarch64
          codesign -s - --force pmem-macos-x86_64
          codesign -s - --force pmem-macos-universal
          
          chmod +x pmem-macos-*

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            pmem-macos-aarch64
            pmem-macos-x86_64
            pmem-macos-universal

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux-x86_64, build-linux-arm64, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute Checksums & Stage Assets
        run: |
          cd release-assets
          sha256sum pmem-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          if [ -f pyintel-code-signing.cer ]; then
            cp pyintel-code-signing.cer release-assets/
          fi
          if [ -f skills/pyintel-mem/SKILL.md ]; then
            cp skills/pyintel-mem/SKILL.md release-assets/
          fi

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Pyintel Mem (${{ steps.release_tag.outputs.tag }}) — Multi-Platform Release"
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
