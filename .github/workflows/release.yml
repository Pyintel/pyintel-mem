name: Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.1)"
        required: true
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin_name: pmem.exe
            asset_name: pmem-windows-x86_64.exe
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin_name: pmem
            asset_name: pmem-linux-x86_64
          - os: macos-latest
            target: aarch64-apple-darwin
            bin_name: pmem
            asset_name: pmem-macos-aarch64
          - os: macos-13
            target: x86_64-apple-darwin
            bin_name: pmem
            asset_name: pmem-macos-x86_64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --release --target ${{ matrix.target }}

      # Code-sign Windows binary with Pyintel Authenticode Certificate
      - name: Sign Windows Binary
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Pyintel Core Intelligence, O=Pyintel, C=US" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5)
          
          # Sign binary
          Set-AuthenticodeSignature -Certificate $cert -FilePath "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          Get-AuthenticodeSignature "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          
          # Copy to release asset name
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "${{ matrix.asset_name }}"

      # Ad-hoc codesign for macOS so Gatekeeper allows execution
      - name: Sign macOS Binary
        if: runner.os == 'macOS'
        run: |
          codesign -s - --force "target/${{ matrix.target }}/release/${{ matrix.bin_name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "${{ matrix.asset_name }}"

      # Copy Linux binary
      - name: Stage Linux Binary
        if: runner.os == 'Linux'
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.bin_name }}" "${{ matrix.asset_name }}"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ matrix.asset_name }}
          if-no-files-found: error

  publish:
    name: Publish Release & Checksums
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Compute SHA-256 Checksums
        run: |
          cd release-artifacts
          sha256sum pmem-* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Copy Public Pyintel Certificate
        run: |
          if [ -f pyintel-code-signing.cer ]; then
            cp pyintel-code-signing.cer release-artifacts/
          fi

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Pyintel Mem (${{ steps.release_tag.outputs.tag }}) — Multi-Platform Release"
          draft: false
          prerelease: false
          files: release-artifacts/*
          generate_release_notes: true
