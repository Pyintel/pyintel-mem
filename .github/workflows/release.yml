name: Multi-Platform Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (e.g. v0.1.1)"
        required: true
        default: "v0.1.1"

permissions:
  contents: write

jobs:
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Release Binary
        run: cargo build --release --target x86_64-pc-windows-msvc

      - name: Sign Windows Binary with Pyintel Certificate
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=Pyintel Core Intelligence, O=Pyintel, C=US" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(5)
          
          # Sign binary with Authenticode
          Set-AuthenticodeSignature -Certificate $cert -FilePath "target/x86_64-pc-windows-msvc/release/pmem.exe"
          Get-AuthenticodeSignature "target/x86_64-pc-windows-msvc/release/pmem.exe"
          
          # Copy to release asset
          Copy-Item "target/x86_64-pc-windows-msvc/release/pmem.exe" "pmem-windows-x86_64.exe"

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: pmem-windows-x86_64.exe

  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - name: Build Release Binary
        run: |
          cargo build --release --target x86_64-unknown-linux-gnu
          cp target/x86_64-unknown-linux-gnu/release/pmem pmem-linux-x86_64
          chmod +x pmem-linux-x86_64

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-artifact
          path: pmem-linux-x86_64

  build-macos:
    name: Build (macOS Universal + Apple Silicon + Intel)
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - name: Build Apple Silicon (ARM64)
        run: cargo build --release --target aarch64-apple-darwin

      - name: Build Intel Mac (x86_64)
        run: cargo build --release --target x86_64-apple-darwin

      - name: Package & Create Universal Binary
        run: |
          cp target/aarch64-apple-darwin/release/pmem pmem-macos-aarch64
          cp target/x86_64-apple-darwin/release/pmem pmem-macos-x86_64
          lipo -create -output pmem-macos-universal pmem-macos-aarch64 pmem-macos-x86_64
          
          # Ad-hoc sign binaries for Gatekeeper
          codesign -s - --force pmem-macos-aarch64
          codesign -s - --force pmem-macos-x86_64
          codesign -s - --force pmem-macos-universal
          
          chmod +x pmem-macos-*

      - name: Upload macOS Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: |
            pmem-macos-aarch64
            pmem-macos-x86_64
            pmem-macos-universal

  publish:
    name: Publish GitHub Release
    needs: [build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Compute Checksums & Stage Assets
        run: |
          cd release-assets
          sha256sum pmem-* > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..
          if [ -f pyintel-code-signing.cer ]; then
            cp pyintel-code-signing.cer release-assets/
          fi

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ github.event.inputs.tag_name }}" >> $GITHUB_OUTPUT
          else
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: "Pyintel Mem (${{ steps.release_tag.outputs.tag }}) — Multi-Platform Release"
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
